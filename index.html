<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style id="appcss">
:root{--bg:#0d1410;--panel:#18261d;--panel2:#203226;--line:#2f4a38;--text:#eef4ec;--muted:#9fb3a3;--fire:#ff8a2a;--gold:#ffc94a;--ok:#6fdc8c;--easy:#5ec2ff;--medium:#ffc94a;--hard:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at top,#1d3326 0%,var(--bg) 60%) fixed;color:var(--text);font-family:Nunito,system-ui,sans-serif;font-size:16px}
button{font-family:inherit;cursor:pointer}
h1,h2,h3{font-family:Bungee,Impact,sans-serif;font-weight:400;margin:0}
code{font-family:'JetBrains Mono',monospace;background:#0b120e;color:var(--gold);padding:1px 6px;border-radius:5px;font-size:.9em;white-space:pre-wrap}
[hidden]{display:none!important}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(10,16,12,.8)}
.brand{font-family:Bungee;font-size:19px;color:var(--gold);margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
select.hsel{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:7px 9px;font:inherit;font-weight:800;max-width:230px}
.pts{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--gold);border-radius:99px;padding:5px 14px;font-family:Bungee;font-size:18px;color:var(--gold)}
.hbtn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 13px;font-weight:800;font-size:14px}
.hbtn:hover{border-color:var(--muted)}
.hbtn.small{color:var(--muted);font-weight:700}
main{display:grid;gap:12px;padding:12px;height:calc(100vh - 64px);min-height:600px}
.mode-type main{grid-template-columns:330px minmax(0,1fr) minmax(0,1fr);grid-template-areas:"q ed pre"}
.mode-blocks main{grid-template-columns:290px minmax(0,1fr) 390px;grid-template-rows:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"pal ws q" "pal ws pre"}
#qCol{grid-area:q}#edCol{grid-area:ed}#palCol{grid-area:pal}#wsCol{grid-area:ws}#preCol{grid-area:pre}
.mode-type #palCol,.mode-type #wsCol,.mode-type .vtab[data-v=code],.mode-type #undoBtn{display:none}
.mode-blocks #edCol{display:none}
@media (max-width:1100px){main,.mode-type main,.mode-blocks main{grid-template-columns:1fr!important;grid-template-rows:none!important;grid-template-areas:none;height:auto}main>.col{grid-area:auto!important;min-height:440px}}
.modes{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.modes button{background:none;border:none;color:var(--muted);font-weight:900;padding:6px 12px;border-radius:8px;font-size:14px}
.modes button.on{background:var(--fire);color:#2a1300}
.colhead.ph{display:flex;justify-content:space-between;align-items:center}
.ftabs{display:flex;gap:4px}
.ftab{background:none;border:1px solid var(--line);color:var(--muted);border-radius:7px 7px 0 0;padding:3px 10px;font-family:'JetBrains Mono',monospace;font-size:12px}
.ftab.on{background:#0e1712;color:var(--gold);border-color:var(--gold)}
.gear{background:rgba(0,0,0,.2);border:none;border-radius:6px;padding:1px 5px;font-size:12px;opacity:.75;cursor:pointer}
.gear:hover{opacity:1}
.block input.attrs{background:#fff7d6}
.block.k-parts{--c:var(--c-parts)}.block.k-av{--c:var(--c-av)}
.vtabs{display:flex;gap:4px}
.vtab{background:none;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:2px 9px;font-family:Nunito;font-weight:800;font-size:12px}
.vtab.active{background:var(--fire);color:#2a1300;border-color:var(--fire)}
#codeView{flex:1;margin:0;overflow:auto;background:#0b120e;color:#cfe3d2;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.5;padding:12px;white-space:pre}
#codeView .tg{color:#7cc4ff}#codeView .at{color:#ffc94a}#codeView .pr{color:#ff9db0}
.codefoot{display:flex;justify-content:flex-end;padding:7px 10px;border-top:1px solid var(--line)}
.scroll{overflow:auto;flex:1;min-height:0}
#palCol,#wsCol{user-select:none;position:relative}
#palette{padding:6px 12px 30px}
.psearch{padding:8px 12px;border-bottom:1px solid var(--line)}
.psearch input{width:100%;background:#0e1712;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:7px 10px;font:inherit;font-size:14px;font-weight:700;outline:none}
.psearch input:focus{border-color:var(--gold)}
.noresult{color:var(--muted);font-size:13px;padding:10px 2px}
.cat{font-family:Bungee;font-size:11px;margin:14px 0 6px;display:flex;align-items:center;gap:6px;color:var(--muted)}
.cat i{width:12px;height:12px;border-radius:50%;display:inline-block}
#palette .block{margin-bottom:6px}
#palette input,#palette select{pointer-events:none}
#palette .block input[type=text]{width:64px!important}
#palette .block select{max-width:84px}
#palette .bhead{gap:4px;padding:6px 8px}
#trash{position:absolute;inset:36px 0 0 0;background:rgba(80,10,10,.75);display:none;place-items:center;font-family:Bungee;color:#ffb3b3;font-size:16px;text-align:center;z-index:3}
body.dragging-ws #trash{display:grid}
#trash.hot{background:rgba(150,20,20,.88)!important;color:#fff}
:root{--c-page:#e6a417;--c-text:#4c97ff;--c-list:#9966ff;--c-media:#3fae4f;--c-link:#e8664a;--c-table:#7a8bff;--c-box:#14a39a;--c-more:#6b7f8f;--c-style:#c552c5;--c-prop:#ff5c7a;--c-parts:#3d7be0;--c-av:#d0548a}
.block{--c:#666;display:block;width:max-content;max-width:100%;border-radius:9px;background:var(--c);color:#fff;font-weight:800;font-size:13.5px;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.bhead{display:flex;align-items:center;gap:6px;padding:7px 10px;cursor:grab;touch-action:none;flex-wrap:wrap}
.tagb{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;background:rgba(0,0,0,.22);padding:1px 6px;border-radius:5px}
.block input,.block select{font-family:Nunito;font-weight:700;font-size:13px;border:none;border-radius:99px;padding:3px 9px;background:#fff;color:#222;outline:none;min-width:0}
.block input[type=text]{width:var(--w,110px)}
.block input[type=number]{width:58px}
.block input[type=color]{width:34px;height:24px;padding:1px 2px;border-radius:6px}
.cont>.slot{margin:0 0 0 14px;padding:6px 8px 6px 6px;min-height:42px;background:rgba(0,0,0,.18);border-radius:0 8px 8px 0;display:flex;flex-direction:column;gap:5px;min-width:170px}
.cont>.bfoot{padding:4px 10px 6px;min-height:12px;display:flex;gap:6px;align-items:center}
.blbl{font-size:11.5px;opacity:.8;margin-right:2px}
.tagb{font-size:12px!important}
.task .almost{display:none;margin:7px 0 0 34px;font-size:14px;font-weight:800;color:#ffb36b}
.task.near .almost{display:block}
.task.near{border-color:#b9772f}
.ask{margin:8px 0 0 34px;background:none;border:none;color:var(--muted);font-size:12.5px;padding:0;text-decoration:underline;cursor:pointer;display:none}
.task:not(.pass) .ask{display:inline-block}
.rstat{margin:8px 0 0 34px;font-size:13px;font-weight:800;color:var(--easy)}
.rstat.ok{color:var(--ok)}.rstat.no{color:#ffb36b}
.rep{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.rep.done{opacity:.6}
.rep .meta{font-size:12.5px;color:var(--muted)}
.rep .tk{font-weight:800;margin:4px 0}
.rep .note{background:#0e1712;border-radius:8px;padding:7px 9px;margin:6px 0;font-style:italic}
.rep .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge-n{display:inline-block;background:var(--hard);color:#fff;border-radius:99px;font-size:11px;font-weight:900;padding:1px 7px;margin-left:5px}
.repcode{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.repcode pre{margin:0;max-height:55vh;overflow:auto;background:#0b120e;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#cfe3d2;white-space:pre-wrap}
.repcode iframe{width:100%;height:55vh;border:1px solid var(--line);border-radius:10px;background:#fff}
@media (max-width:800px){.repcode{grid-template-columns:1fr}}
.slot:not(:has(>.block))::after{content:attr(data-ph);color:rgba(255,255,255,.55);font-size:12px;font-style:italic;padding:4px 2px}
.k-page{--c:var(--c-page)}.k-text{--c:var(--c-text)}.k-list{--c:var(--c-list)}.k-media{--c:var(--c-media)}.k-link{--c:var(--c-link)}.k-table{--c:var(--c-table)}.k-box{--c:var(--c-box)}.k-more{--c:var(--c-more)}.k-style{--c:var(--c-style)}.k-prop{--c:var(--c-prop)}
.block.moving{opacity:.25}
#ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:100;opacity:.92;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}
.marker{height:5px;border-radius:3px;background:#fff;box-shadow:0 0 10px #fff;margin:1px 0;min-width:120px}
.slot.ok{outline:2px dashed var(--ok);outline-offset:2px}.slot.bad{outline:2px dashed #ff6b6b;outline-offset:2px}
#ws{padding:16px;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:18px 18px}
.htmlframe{border:2px solid #556b5c;border-radius:12px;padding:10px 12px 12px;background:rgba(0,0,0,.18);min-width:min(100%,480px);width:max-content;max-width:100%}
.htmlframe .lbl{font-family:'JetBrains Mono',monospace;color:#c7d6c9;font-size:13px}
.zone{margin:8px 0 0 10px;border-left:3px solid #556b5c;padding:4px 0 6px 10px}
.zl{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--gold)}
.zl.zc{margin-top:6px}
.zl span{font-family:Nunito;color:var(--muted);font-size:12px;margin-left:6px}
.zone>.slot{display:flex;flex-direction:column;gap:6px;min-height:48px;padding:8px;margin-top:6px;border-radius:10px;background:rgba(255,255,255,.03);border:1px dashed #3d5545}
.col{background:rgba(24,38,29,.92);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.colhead{padding:9px 14px;border-bottom:1px solid var(--line);font-family:Bungee;font-size:12px;color:var(--muted)}

/* quest panel */
.qwrap{padding:16px;overflow:auto;flex:1}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--panel2);color:var(--muted);font-size:11px;font-weight:900;display:grid;place-items:center;padding:0}
.dot.done{background:var(--ok);border-color:var(--ok);color:#0b2414}
.dot.cur{border-color:var(--fire);color:var(--text);box-shadow:0 0 0 2px rgba(255,138,42,.35)}
.dot.lock{opacity:.4;cursor:not-allowed}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.badge{font-size:12px;font-weight:900;border-radius:99px;padding:3px 10px;letter-spacing:.5px}
.d-easy{background:rgba(94,194,255,.15);color:var(--easy)}.d-medium{background:rgba(255,201,74,.15);color:var(--medium)}.d-hard{background:rgba(255,107,107,.15);color:var(--hard)}
.b-pts{background:rgba(255,201,74,.12);color:var(--gold)}.b-prize{background:rgba(111,220,140,.13);color:var(--ok)}
.qtitle{font-size:24px;line-height:1.15;margin:4px 0 14px}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.task{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:11px 12px;transition:.25s}
.task .row{display:flex;gap:10px;align-items:flex-start}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;color:transparent;font-weight:900;transition:.25s}
.task.pass{border-color:var(--ok)}
.task.pass .box{background:var(--ok);border-color:var(--ok);color:#0b2414}
.ttext{flex:1;font-size:16px;line-height:1.4;font-weight:700}
.tasks{counter-reset:step}
.task .ttext::before{counter-increment:step;content:"Task " counter(step) ": ";color:var(--fire);font-family:Bungee;font-size:.8em;letter-spacing:.3px}
.tip{flex:none;background:none;border:none;font-size:18px;padding:0 2px;opacity:.75}
.tip:hover{opacity:1}
.hint{display:none;margin:8px 0 0 34px;font-size:14px;color:#e9d9b4;background:#2a2213;border-radius:8px;padding:7px 9px}
.task.showhint .hint{display:block}
.tick{margin:8px 0 0 34px;background:none;border:1px dashed var(--muted);color:var(--muted);border-radius:7px;padding:3px 9px;font-size:13px}
.goal{margin-top:16px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 12px;font-weight:800;font-size:14px;width:100%}
.goal:hover{color:var(--text)}
.empty{color:var(--muted);text-align:center;padding:40px 10px}

/* editor */
.edwrap{flex:1;display:flex;min-height:0}
#gutter{padding:12px 8px 12px 10px;text-align:right;color:#4f6a57;font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.55;overflow:hidden;background:#0c140f;min-width:42px;white-space:pre;user-select:none}
#code{flex:1;resize:none;border:none;outline:none;background:#0e1712;color:#dbe9dc;font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.55;padding:12px;tab-size:2;white-space:pre;overflow:auto}
#preview,#goalPrev{flex:1;border:none;background:#fff;width:100%}
#goalNote{padding:6px 12px;font-size:13px;font-weight:800;color:#2a1300;background:var(--gold)}
.vtab[data-v=goal].active{background:var(--gold);border-color:var(--gold)}
#baseFrame{position:fixed;left:-12000px;top:0;width:900px;height:700px;visibility:hidden;border:0}

/* overlays */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(150px);background:var(--panel2);border:1px solid var(--gold);padding:10px 18px;border-radius:12px;font-weight:800;z-index:300;transition:transform .3s;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.overlay{position:fixed;inset:0;background:rgba(5,9,6,.84);display:none;place-items:center;z-index:200;padding:16px}
.overlay.show{display:grid}
.win{background:radial-gradient(circle at top,#3a2a12,#16130c);border:2px solid var(--gold);border-radius:20px;padding:28px 36px;text-align:center;max-width:420px;box-shadow:0 0 60px rgba(255,138,42,.4);animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.win h2{color:var(--gold);font-size:26px}
.win .big{font-family:Bungee;font-size:34px;color:var(--gold);margin:10px 0}
.win .prize{margin:12px 0;padding:12px;border-radius:14px;background:rgba(111,220,140,.1);border:1px solid var(--ok)}
.win .prize .em{font-size:56px;line-height:1}
.win .prize img{width:90px;height:90px;object-fit:cover;border-radius:12px}
.win button{margin-top:12px;background:var(--fire);border:none;color:#2a1300;font-family:Bungee;font-size:16px;border-radius:12px;padding:11px 26px}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(760px,100%);max-height:92vh;overflow:auto}
.mbox h2{font-size:18px;color:var(--gold);margin-bottom:12px}
.mbox p{color:var(--muted)}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.pbtn{background:var(--fire);border:none;color:#2a1300;font-weight:900;border-radius:10px;padding:9px 16px;font-size:14px}
.pbtn:disabled{opacity:.4;cursor:not-allowed}
.sbtn{background:none;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:700}
#bigView{padding:14px;z-index:190}
.bigbox{width:100%;height:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.bigbar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bignote{flex:1;font-size:13px;color:var(--muted);font-weight:700}
.bigframes{flex:1;display:flex;gap:10px;padding:10px;min-height:0}
.bf{flex:1;display:flex;flex-direction:column;min-width:0}
.bf iframe{flex:1;border:none;border-radius:10px;background:#fff;width:100%}
.bfl{font-family:Bungee;font-size:11px;color:var(--muted);padding:0 2px 6px;display:none}
.both .bfl{display:block}
.vtab.big{margin-left:6px}
.goalframe{width:100%;height:62vh;border:1px solid var(--line);border-radius:12px;background:#fff}

/* collection */
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{background:none;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:6px 14px;font-weight:800}
.tab.on{background:var(--gold);color:#2a1d00;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.itm{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.itm .em{font-size:46px;line-height:1.1}
.itm img{width:72px;height:72px;object-fit:contain;border-radius:10px}
.itm .nm{font-weight:900;font-size:14px}
.itm .sub{font-size:12px;color:var(--muted)}
.itm.own{border-color:var(--ok)}
.itm.locked .em,.itm.locked img{filter:grayscale(1) brightness(.5)}
.itm .buy{background:var(--gold);border:none;color:#2a1d00;font-weight:900;border-radius:9px;padding:6px 10px;font-size:13px;width:100%}
.itm .buy:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.itm .cnt{font-size:12px;font-weight:900;color:var(--ok)}

/* teacher */
#teacherView{position:fixed;inset:0;z-index:150;background:var(--bg);overflow:auto}
#guideView{position:fixed;inset:0;z-index:155;background:var(--bg);overflow:auto}
.gd{max-width:860px;margin:0 auto;padding:0 18px 70px;line-height:1.55}
.gd h3{font-size:16px;color:var(--gold);margin:26px 0 10px}
.gd p{margin:6px 0 10px;color:#dfe8dc}
.gd .steps{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.gd .steps li{counter-increment:s;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px 10px 50px;position:relative}
.gd .steps li::before{content:counter(s);position:absolute;left:12px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--fire);color:#2a1300;font-family:Bungee;font-size:13px;display:grid;place-items:center}
.gd table{width:100%;border-collapse:collapse;margin:8px 0;font-size:14.5px}
.gd th,.gd td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.gd th{background:var(--panel2);color:var(--gold);font-weight:800}
.gd .note{background:#2a2213;border:1px dashed #6b5523;border-radius:10px;padding:9px 12px;color:#ecdcb6;font-size:14.5px}
.gd .kid{font-size:17px}
.tv{max-width:1200px;margin:0 auto;padding:0 16px 60px}
.tvbar{position:sticky;top:0;z-index:5;background:#0d1a12;box-shadow:0 6px 12px rgba(0,0,0,.4);display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.tvbar h2{font-size:18px;color:var(--gold);margin-right:auto}
.st{font-size:13px;color:var(--muted)}.st.dirty{color:var(--gold)}
.tnav{display:flex;gap:6px;margin:14px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h3{font-size:14px;color:var(--gold);margin-bottom:8px}
.tv label{display:block;font-size:12.5px;font-weight:800;color:var(--muted);margin:10px 0 4px}
.tv input,.tv select,.tv textarea,.mbox input,.mbox textarea{width:100%;background:#0e1712;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 10px;font:inherit;font-size:14px}
.tv textarea{font-family:'JetBrains Mono',monospace;font-size:12.5px;resize:vertical}
.tgrid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px}
@media (max-width:820px){.tgrid{grid-template-columns:1fr}}
.lbtn{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 11px;font-weight:800;font-size:14px;margin-bottom:6px}
.lbtn.on{border-color:var(--fire)}
.dash{border:1px dashed var(--line);background:none;color:var(--muted);border-radius:9px;padding:8px 12px;font-weight:800;font-size:13.5px}
.dash:hover{color:var(--text)}
.bigbtn{background:linear-gradient(90deg,var(--fire),var(--gold));border:none;color:#2a1300;font-weight:900;border-radius:10px;padding:10px 16px;font-size:15px}
.qed{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.qed .top{display:flex;gap:6px;align-items:center}
.qed .top input{flex:1;font-weight:800}
.qed .top select{width:auto}
.ted{display:flex;gap:6px;align-items:center;margin-top:6px}
.ted input{flex:1}
.ted .ck{font-size:11.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:none;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:4px 8px;font-size:12.5px;flex:none}
.ib:hover{color:var(--text)}
.ib.del:hover{color:#ff9a9a;border-color:#6b2a2a}
.help{font-size:13px;color:var(--muted);line-height:1.5}
.irow{display:grid;grid-template-columns:64px 1fr 90px 170px auto auto;gap:8px;align-items:center;margin-bottom:8px}
.irow .pic{width:56px;height:56px;border-radius:10px;background:#0e1712;border:1px solid var(--line);display:grid;place-items:center;font-size:30px;overflow:hidden;cursor:pointer;position:relative}
.irow .pic img{width:100%;height:100%;object-fit:contain}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
.chk input{width:auto}
.claim{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.claim .em{font-size:28px}
.claim .x{flex:1}
.claim.given{opacity:.55}
.prog{font-size:13px;color:var(--muted);margin-top:8px}
.limrow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;margin-top:4px}
.limrow>div{flex:1;min-width:170px}
.rz{position:fixed;z-index:60;touch-action:none}
.rz.v{width:12px;cursor:col-resize}.rz.h{height:12px;cursor:row-resize}
.rz::after{content:'';position:absolute;background:#3d5a46;border-radius:3px;transition:background .15s,transform .15s}
.rz.v::after{left:4.5px;top:calc(50% - 22px);width:3px;height:44px}
.rz.h::after{top:4.5px;left:calc(50% - 22px);height:3px;width:44px}
.rz:hover::after,.rz.on::after{background:var(--gold);transform:scale(1.3)}
body.resizing iframe{pointer-events:none}
body.resizing,body.resizing *{user-select:none!important}
#pets{position:fixed;inset:0;pointer-events:none;z-index:160;overflow:hidden}
#pets.off{display:none}
.pet{position:absolute;left:0;top:0;width:58px;height:58px;pointer-events:auto;cursor:grab;touch-action:none;user-select:none;will-change:transform}
.pet .body{width:100%;height:100%;display:grid;place-items:center;font-size:calc(var(--s,58px)*.82);line-height:1;filter:drop-shadow(0 4px 4px rgba(0,0,0,.45));transition:transform .15s}
.pet .body img{width:100%;height:100%;object-fit:contain}
.pet.walking .body{animation:waddle .5s infinite alternate ease-in-out}
.pet.m-run.walking .body{animation-duration:.18s}
.pet.m-fly .body{animation:flap .22s infinite alternate ease-in-out}
.pet.m-dance .body{animation:dance .9s infinite ease-in-out}
.pet.m-sleep .body{animation:breathe 2.4s infinite ease-in-out;filter:drop-shadow(0 4px 4px rgba(0,0,0,.45)) saturate(.7)}
.pet.m-stay .body,.pet.m-orbit .body{animation:none}
.pet.crawl .body{animation:crawl .3s infinite alternate}
@keyframes flap{from{scale:1 1}to{scale:1 .78}}
@keyframes dance{0%{translate:0 0;rotate:0deg}25%{translate:0 -14px;rotate:-15deg}50%{translate:0 0;rotate:0deg}75%{translate:0 -14px;rotate:15deg}100%{translate:0 0;rotate:0deg}}
@keyframes breathe{0%,100%{scale:1 1}50%{scale:1.06 .94}}
@keyframes crawl{from{translate:0 -2px}to{translate:0 2px}}
.pet.m-float .body{animation:bob 1.6s infinite alternate ease-in-out}
@keyframes waddle{from{rotate:-6deg}to{rotate:6deg}}
@keyframes bob{from{translate:0 -4px}to{translate:0 4px}}
.pet .bubble{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);background:#fff;color:#1a1a1a;font-weight:900;font-size:13px;white-space:nowrap;padding:5px 10px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.35);display:none}
.pet .bubble::after{content:'';position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff}
.pet .bubble.show{display:block}
.kind{font-size:11px;font-weight:900;border-radius:99px;padding:2px 8px}
.kind.sticker{background:rgba(94,194,255,.15);color:var(--easy)}
.kind.merch{background:rgba(255,201,74,.13);color:var(--gold)}
.itm .use{background:var(--easy);border:none;color:#062033;font-weight:900;border-radius:9px;padding:6px 10px;font-size:13px;width:100%}
.itm .use.on{background:none;border:1px solid var(--easy);color:var(--easy)}
.hcount{margin:6px 0 2px;font-size:14px;font-weight:800;color:var(--fire)}

#forestBg .moon{display:none;position:absolute;top:5%;right:6%;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 36% 34%,#fffcef,#dcdfcc 58%,#a7ad98);box-shadow:0 0 70px 24px rgba(215,228,255,.22)}

#forestBg .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:tw 3s infinite alternate}
#forestBg .ff{position:absolute;width:7px;height:7px;border-radius:50%;background:#ffe27a;box-shadow:0 0 10px 3px rgba(255,214,90,.7);animation:ffly 10s infinite ease-in-out;opacity:0}

#forestBg .eyes::before{left:0}#forestBg .eyes::after{right:0}
@keyframes tw{from{opacity:.25}to{opacity:.95}}

function b64(bytes){var s='';for(var i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s);}

      return new Response(cs).arrayBuffer().then(function(buf){return 'CQZ1:'+b64(new Uint8Array(buf));}).catch(function(){return 'CQ1:'+b64(bytes);});}catch(e){}}

  var p=m[1]==='CQZ1'?(window.DecompressionStream?new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer().then(function(b){return new Uint8Array(b);}):Promise.reject(new Error('This browser cannot read this code.'))):Promise.resolve(bytes);
  return p.then(function(b){var o=JSON.parse(new TextDecoder().decode(b));if(!o||!o.p||typeof o.p.points!=='number')throw new Error('The code is broken. Copy the whole code.');return o;})

}

/* ============ SCREEN STICKERS (little pets) ============ */
var pets=[],SAY=['Keep coding!','You got this!','Nice work!','Don’t forget </ tags>!','Night is coming…','Let’s build!','Yum, code!','Go go go!','Watch out for the deer!','Almost there!'];
function syncPets(){
  var want=(P.using||[]).filter(function(id){return itemById(id)&&ownedCount(id);});P.using=want;
  pets=pets.filter(function(p){if(want.indexOf(p.id)<0){p.el.remove();return false;}return true;});

}
var MOVES=[['walk','🚶 walks'],['run','🏃 runs fast'],['hop','🐇 hops'],['roll','🛞 rolls'],['float','👻 floats'],['fly','🦅 flies'],['bounce','⚽ bounces around'],['chase','🐾 follows the mouse'],['climb','🕷️ climbs the edges'],['peek','🙈 peeks and hides'],['orbit','🌀 circles around'],['dance','💃 dances'],['sleep','😴 sleeps'],['stay','📌 stays still']];
var mouse={x:-1,y:-1};window.addEventListener('pointermove',function(e){mouse.x=e.clientX;mouse.y=e.clientY;},true);
function rnd(a,b){return a+Math.random()*(b-a);}
function sign(){return Math.random()<.5?-1:1;}
function addPet(it){
  var el=document.createElement('div');el.className='pet';var SZ={S:42,M:58,L:86}[it.size||'M']||58;el.style.width=el.style.height=SZ+'px';el.style.setProperty('--s',SZ+'px');
  el.innerHTML='<div class="bubble"></div><div class="body">'+(it.img?'<img src="'+esc(it.img)+'" alt="">':esc(it.emoji||'⭐'))+'</div>';
  $('pets').appendChild(el);
  var mv=it.move||'walk',W=innerWidth,H=innerHeight;
  var p={S:SZ,id:it.id,el:el,body:el.querySelector('.body'),mode:mv,x:rnd(10,W-SZ-10),y:-60,vx:sign()*rnd(35,70),vy:0,pause:0,face:1,rot:0,t:rnd(0,10),drag:null,bubbleT:0,st:0,timer:0};
  if(mv==='run')p.vx*=3;
  if(mv==='float'){p.y=rnd(120,H-200);p.vy=sign()*25;}
  if(mv==='bounce'){p.vx=sign()*130;p.vy=sign()*110;p.y=rnd(100,H-200);}
  if(mv==='fly'){p.vx=sign()*rnd(80,120);p.base=rnd(90,H*.5);p.y=p.base;}
  if(mv==='orbit'){p.cx=rnd(150,W-150);p.cy=rnd(150,H-150);p.ang=0;p.y=p.cy;}
  if(mv==='climb'){p.edge=0;p.y=H-SZ;}
  if(mv==='peek'){p.st=0;p.timer=rnd(1,3);p.x=-SZ;p.y=H-SZ;}
  if(mv==='chase'){p.y=rnd(100,H-200);}
  if(mv==='stay'||mv==='dance'||mv==='sleep'){p.y=rnd(140,H-SZ-10);}

function say(p,t){var b=p.el.querySelector('.bubble');b.textContent=t;b.classList.add('show');p.bubbleT=1.8;}

        p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx+=(Math.random()-.5)*20*dt;p.vy+=(Math.random()-.5)*20*dt;
        var sp=Math.hypot(p.vx,p.vy);if(sp>60){p.vx*=.98;p.vy*=.98;}if(sp<20){p.vx*=1.05;p.vy*=1.05;}
        walls(p,W);if(p.y<70){p.y=70;p.vy=Math.abs(p.vy);}if(p.y>H-S){p.y=H-S;p.vy=-Math.abs(p.vy);}
      }else if(m==='fly'){
        p.x+=p.vx*dt;walls(p,W);p.base=Math.max(70,Math.min(H-S-60,p.base+(Math.random()-.5)*30*dt));p.y=p.base+Math.sin(p.t*2.2)*45;rot=Math.sin(p.t*2.2+1.5)*-12*(p.vx<0?-1:1);
      }else if(m==='bounce'){
        p.x+=p.vx*dt;p.y+=p.vy*dt;walls(p,W);if(p.y<0){p.y=0;p.vy=Math.abs(p.vy);}if(p.y>H-S){p.y=H-S;p.vy=-Math.abs(p.vy);}
      }else if(m==='chase'){
        if(mouse.x>=0){var dx=mouse.x-(p.x+S/2),dy=mouse.y-(p.y+S/2),dd=Math.hypot(dx,dy);
          if(dd>S+20){var v=Math.min(260,dd*2);p.vx=dx/dd*v;p.x+=p.vx*dt;p.y+=dy/dd*v*dt;walking=true;}}
      }else if(m==='climb'){
        var v2=70*dt;walking=true;flip=false;
        if(p.edge===0){p.y=H-S;p.x+=v2;rot=0;if(p.x>=W-S){p.x=W-S;p.edge=1;}}
        else if(p.edge===1){p.x=W-S;p.y-=v2;rot=-90;if(p.y<=0){p.y=0;p.edge=2;}}
        else if(p.edge===2){p.y=0;p.x-=v2;rot=180;if(p.x<=0){p.x=0;p.edge=3;}}
        else{p.x=0;p.y+=v2;rot=90;if(p.y>=H-S){p.y=H-S;p.edge=0;}}
      }else if(m==='peek'){
        p.timer-=dt;
        if(p.st===0&&p.timer<=0){p.side=Math.floor(Math.random()*3);p.pos=p.side===2?rnd(40,W-S-40):rnd(120,H-S-40);p.st=1;p.timer=rnd(2,3.5);p.k=0;}
        if(p.st===1){p.k=Math.min(1,p.k+dt*2.5);if(p.timer<=0){p.st=2;p.timer=.6;}}
        if(p.st===2){p.k=Math.max(0,p.k-dt*2.5);if(p.k<=0){p.st=0;p.timer=rnd(3,7);}}
        var show=p.k*S*.6;
        if(p.side===0){p.x=-S+show;p.y=p.pos;rot=90*(1-p.k)*0+20;p.face=-1;}
        else if(p.side===1){p.x=W-show;p.y=p.pos;rot=-20;p.face=1;}
        else{p.x=p.pos;p.y=H-show;rot=0;}
        flip=false;
      }else if(m==='orbit'){
        p.ang+=1.3*dt;p.x=p.cx+Math.cos(p.ang)*90-S/2+S/2;p.y=p.cy+Math.sin(p.ang)*60;p.vx=-Math.sin(p.ang);
      }else if(m==='sleep'){
        if(p.awake>0)p.awake-=dt;else if(p.bubbleT<=0&&Math.random()<dt*.35)say(p,'💤');
      }
      p.x=Math.max(-S,Math.min(W,p.x));p.y=Math.max(-S,Math.min(H,p.y));
      if(flip&&Math.abs(p.vx)>1)p.face=p.vx<0?1:-1;
    }
    if(p.hopv||p.hopy){p.hopy=(p.hopy||0)+(p.hopv||0)*dt;p.hopv=(p.hopv||0)+1400*dt;if(p.hopy>=0){p.hopy=0;p.hopv=0;}}
    if(p.spin>0){p.spin-=dt*1.6;rot+=(1-p.spin)*360;if(p.spin<=0)p.spin=0;}
    p.el.classList.toggle('walking',walking&&m!=='climb');
    p.el.classList.toggle('crawl',m==='climb');
    p.el.style.transform='translate('+p.x.toFixed(1)+'px,'+(p.y+(p.hopy||0)).toFixed(1)+'px)';
    p.body.style.transform='rotate('+rot.toFixed(1)+'deg) scaleX('+(flip||m==='peek'?p.face:1)+')';
  });
  requestAnimationFrame(petLoop);
}

/* PIN is stored only as a salted PBKDF2 hash, never as plain text. */
var PINIT=200000,pinFails=0,pinLock=0;
function b64(u){var s='';u=new Uint8Array(u);for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
function unb64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function pinDerive(pin,salt,it){return crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']).then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:salt,iterations:it},k,256);});}
function pinHash(pin){var salt=crypto.getRandomValues(new Uint8Array(16));return pinDerive(pin,salt,PINIT).then(function(bits){return 'pbkdf2$'+PINIT+'$'+b64(salt)+'$'+b64(bits);});}
function pinCheck(pin){var s=DATA.pin;if(s.indexOf('pbkdf2$')!==0)return Promise.resolve(pin===s);var p=s.split('$'),it=Math.min(+p[1]||PINIT,1000000);return pinDerive(pin,unb64(p[2]),it).then(function(bits){var a=b64(bits),b=p[3]||'',d=a.length^b.length;for(var i=0;i<a.length;i++)d|=a.charCodeAt(i)^b.charCodeAt(i);return d===0;});}

      '<button class="bigbtn" data-hcust="'+esc(pr.id)+'">✏️ '+(b?(b.d>=b.n?'Done':'Continue'):'Make it mine')+'<small>'+st(b)+'</small></button></div>'+
      ((a||b)?'<div class="hrm">'+(a?'<button data-hrm="hp-'+esc(pr.id)+'">🗑 Remove practice</button>':'')+(b?'<button data-hrm="hc-'+esc(pr.id)+'">🗑 Remove my version</button>':'')+'</div>':'')+'</div></div>';
  });
  h+='</div>';
  $('hallView').innerHTML=h+'</div>';
}
function openHall(){$('hallView').hidden=false;renderHall();$('hallView').scrollTop=0;}
var hoTab='site',hoPage='index.html';
function hallOpen(pid,tab,page){var pr=hallProj(pid);if(!pr)return;hoTab=tab||'site';var names=pagesOf(pr);hoPage=names.indexOf(page)>=0?page:(names.indexOf(hoTab)>=0?hoTab:'index.html');
  var css=norm(pr.finalCss)&&names.some(function(n){return linkedCss(finalOf(pr,n)).length;});
  var body=hoTab==='site'?(names.length>1?'<div class="hpages">'+names.map(function(n){return '<button class="ptab'+(n===hoPage?' on':'')+'" data-hp="'+esc(n)+'">🌐 '+esc(n)+'</button>';}).join('')+'</div>':'')+'<iframe class="hoframe" id="hoFrame" srcdoc="'+esc(processCode(buildPage(finalOf(pr,hoPage),pr.finalCss)))+'"></iframe>':'<pre class="hocode">'+highlight(hoTab==='css'?pr.finalCss:finalOf(pr,hoTab))+'</pre>';
  modal('<h2>'+esc(pr.title)+'</h2><div class="tabs"><button class="tab'+(hoTab==='site'?' on':'')+'" data-ho="site">🌐 Website</button>'+names.map(function(n){return '<button class="tab'+(hoTab===n?' on':'')+'" data-ho="'+esc(n)+'">📄 '+esc(n)+'</button>';}).join('')+(css?'<button class="tab'+(hoTab==='css'?' on':'')+'" data-ho="css">🎨 style.css</button>':'')+'</div>'+body+
    '<div class="mrow"><button class="sbtn" data-close>Close</button><button class="pbtn" data-hprac="'+esc(pr.id)+'">🎯 Practice: build it again</button><button class="bigbtn" data-hcust="'+esc(pr.id)+'">✏️ Make it mine</button></div>');
  $('modalBox').classList.add('wide');
  $('modalBox').querySelectorAll('[data-ho]').forEach(function(b){b.onclick=function(){hallOpen(pid,b.dataset.ho,hoPage);};});
  $('modalBox').querySelectorAll('[data-hp]').forEach(function(b){b.onclick=function(){hallOpen(pid,'site',b.dataset.hp);};});
  if($('hoFrame'))hookLinks($('hoFrame'),function(n){hallOpen(pid,'site',n);},function(){return names;});
}
function hallRemove(id){var h=P.hall[id];if(!h)return;
  confirmBox('Remove <b>'+esc(h.title)+'</b>? Your code and ticks for it are deleted. You keep the points and prizes you already won.',function(){
    var paid=(P.hallPaid=P.hallPaid||{})[id]=P.hallPaid[id]||[],lp=P.lessons[id];if(lp)(h.quests||[]).forEach(function(q,i){if(lp.done[q.id]&&paid.indexOf(i)<0)paid.push(i);});
    delete P.hall[id];delete P.lessons[id];P.reports=(P.reports||[]).filter(function(r){return r.lid!==id;});
    var was=P.hallOn===id;if(was){P.hallOn='';lastPass=[];undo=[];}saveP();if(!$('hallView').hidden)renderHall();if(was||$('hallView').hidden)renderStudent();else renderHeader();if(!$('teacherView').hidden)renderTeacher();toast('🗑 Removed');},'Remove');}
function hallClicks(e){
  var rm=e.target.closest('[data-hrm]');if(rm){hallRemove(rm.dataset.hrm);return true;}
  var o=e.target.closest('[data-hopen]');if(o){hallOpen(o.dataset.hopen);return true;}
  var p=e.target.closest('[data-hprac]');if(p){startHall(p.dataset.hprac,false);return true;}
  var c=e.target.closest('[data-hcust]');if(c){startHall(c.dataset.hcust,true);return true;}
  return false;}
$('hallBtn').onclick=openHall;
$('hallView').addEventListener('click',function(e){if(e.target.id==='hallClose'){$('hallView').hidden=true;return;}hallClicks(e);});
$('modal').addEventListener('click',function(e){if(e.target.closest('#modalBox [data-hopen],#modalBox [data-hprac],#modalBox [data-hcust]'))hallClicks(e);});
function pagesEd(b,arr){var h='<label>Extra pages (for a site with more than one page). Link them with <code>&lt;a href=&quot;about.html&quot;&gt;</code></label>';
  (arr||[]).forEach(function(pg,k){h+='<div class="pged"><div style="display:flex;gap:6px;align-items:center"><div style="width:220px">'+inp(b+'.pages.'+k+'.name','about.html')+'</div><button class="ib del" data-act="pgDel" data-path="'+b+'" data-k="'+k+'">✕ Remove page</button></div><textarea rows="8" data-b="'+b+'.pages.'+k+'.code">'+esc(pg.code||'')+'</textarea></div>';});
  return h+'<button class="dash" data-act="pgAdd" data-path="'+b+'" style="padding:4px 10px">+ Page</button>';}
function tHall(){
  var H=DATA.hall||[];
  var h='<div class="card"><h3>🏛 Hall projects</h3><p class="help">Demo projects the student can open, practise (build again with the normal quests) or “make it mine” (the same steps, but with his own words, colours and pictures, plus one extra thing of his own). Changes reach him after <b>💾 Save to page</b>.</p><button class="dash" data-act="hAdd">+ New project</button> <button class="sbtn" data-act="hRestore">Restore the built-in projects</button></div>';
  var mine=Object.keys(P.hall||{});
  h+='<div class="card"><h3>His Hall progress on this device</h3>'+(mine.length?mine.map(function(id){var x=hallProg(id);return '<div class="claim"><div class="x"><b>'+esc(P.hall[id].title)+'</b><div class="help">'+(x?x.d+' of '+x.n+' quests done':'')+'</div></div><button class="ib del" data-hrm="'+esc(id)+'">🗑 Remove</button></div>';}).join(''):'<p class="help">He hasn’t started any Hall project here.</p>')+'</div>';
  H.forEach(function(pr,i){var b='hall.'+i;
    h+='<div class="card"><div style="display:flex;gap:6px;align-items:center"><h3 style="flex:1;margin:0">'+esc(pr.title||'Project')+(pr.hidden?' <span class="help">(hidden)</span>':'')+'</h3><label class="chk"><input type="checkbox" data-hhide="'+i+'"'+(pr.hidden?' checked':'')+'> hide</label><button class="ib" data-act="hPrev" data-i="'+i+'">👀</button><button class="ib" data-act="hUp" data-i="'+i+'">↑</button><button class="ib" data-act="hDown" data-i="'+i+'">↓</button><button class="ib del" data-act="hDel" data-i="'+i+'">Delete</button></div>'+
      '<div class="hrow"><div><label>Name</label>'+inp(b+'.title')+'</div><div><label>Phase</label>'+inp(b+'.phase','1','number')+'</div><div><label>Lessons</label>'+inp(b+'.lessons','9–12')+'</div><div><label>Topic</label>'+inp(b+'.topic','Tables')+'</div></div>'+
      '<label>Short description</label>'+inp(b+'.desc')+
      '<label>Builds on</label><select data-b="'+b+'.basedOn"><option value="">Nothing (start from an empty file)</option>'+H.map(function(x){return x.id===pr.id?'':'<option value="'+esc(x.id)+'"'+(pr.basedOn===x.id?' selected':'')+'>'+esc(x.title)+'</option>';}).join('')+'</select>'+
      '<div class="hrow"><div><label>Max quests: Practice</label>'+inp(b+'.max','10','number')+'</div><div><label>Max quests: Make it mine</label>'+inp(b+'.customMax','8','number')+'</div></div>'+
      '<details><summary>Code</summary><label>index.html</label><textarea rows="10" data-b="'+b+'.finalCode">'+esc(pr.finalCode||'')+'</textarea><label>style.css (only if linked)</label><textarea rows="5" data-b="'+b+'.finalCss">'+esc(pr.finalCss||'')+'</textarea>'+pagesEd(b,pr.pages)+'</details></div>';});
  return h;
}

/* ============ INIT ============ */
ensureQuests();
if(P.lesson>=DATA.lessons.length)P.lesson=0;
renderStudent();syncPets();updTeacherBadge();
window.__cq={lessonQuests:lessonQuests,breakdown:breakdown,codeToBlocks:codeToBlocks,load:function(o,blocks){var p=LP();p.code=o.code;p.css=o.css||'';Object.keys(o.pages||{}).forEach(function(n){PG(n).code=o.pages[n];});if(blocks){allToBlocks();P.mode='blocks';}else P.mode='type';saveP();renderStudent();}};
})();
