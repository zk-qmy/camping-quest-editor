<!DOCTYPE html>
<html>
  <head>
    <title>Camp Schedule</title>
  </head>
  <body>
    <h1>99 Nights Camp Schedule</h1>
    <img src="campfire.png" width="80px" height="80px">
    <p>Every survivor has a job. Check the table before night falls!</p>

    <table style="border: 2px solid green; border-collapse: collapse">
      <tr style="background-color: darkgreen; color: white">
        <td>Job</td>
        <td>Time</td>
        <td>Danger</td>
      </tr>
      <tr style="border: 1px solid green">
        <td><img src="axe.png" width="30px" height="30px">Chop wood</td>
        <td>Morning</td>
        <td style="background-color: lightgreen">Low</td>
      </tr>
      <tr style="border: 1px solid green">
        <td><img src="carrot.png" width="30px" height="30px">Find food</td>
        <td>Afternoon</td>
        <td style="background-color: yellow">Medium</td>
      </tr>
      <tr style="border: 1px solid green">
        <td><img src="flashlight.png" width="30px" height="30px">Night watch</td>
        <td>Night</td>
        <td style="background-color: red; color: white">High</td>
      </tr>
    </table>

    <font color="red">Never go into the forest alone!</font>
    <a href="https://en.wikipedia.org/wiki/Survival_skills">Learn more survival skills</a>
  </body>
</html>
